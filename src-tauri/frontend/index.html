<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Standard Ebooks Manager</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #1a1a2e;
  --surface: #16213e;
  --surface2: #0f3460;
  --accent: #e94560;
  --accent-hover: #ff6b81;
  --text: #eee;
  --text-dim: #999;
  --success: #2ecc71;
  --radius: 8px;
  --shadow: 0 2px 8px rgba(0,0,0,.3);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* Header */
header {
  background: var(--surface);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  gap: 20px;
  box-shadow: var(--shadow);
  position: sticky;
  top: 0;
  z-index: 100;
}

header h1 {
  font-size: 1.2rem;
  font-weight: 600;
  white-space: nowrap;
}

#search {
  flex: 1;
  max-width: 500px;
  padding: 8px 14px;
  border: 1px solid #333;
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--text);
  font-size: 0.95rem;
  outline: none;
  transition: border-color .2s;
}
#search:focus { border-color: var(--accent); }

.stats {
  font-size: 0.85rem;
  color: var(--text-dim);
  white-space: nowrap;
}

/* Toolbar */
.toolbar {
  background: var(--surface);
  padding: 8px 24px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  border-bottom: 1px solid #222;
}

.toolbar button {
  padding: 6px 16px;
  border: none;
  border-radius: var(--radius);
  background: var(--surface2);
  color: var(--text);
  font-size: 0.85rem;
  cursor: pointer;
  transition: background .15s;
}
.toolbar button:hover { background: var(--accent); }
.toolbar button:disabled { opacity: .5; cursor: not-allowed; }
.toolbar button.cancel { background: var(--accent); }

/* Progress bar */
#progress-bar {
  height: 3px;
  background: var(--bg);
  position: relative;
  overflow: hidden;
}
#progress-bar .fill {
  height: 100%;
  background: var(--accent);
  width: 0%;
  transition: width .3s;
}
#progress-msg {
  font-size: 0.8rem;
  color: var(--text-dim);
  padding: 4px 24px;
  min-height: 22px;
  background: var(--surface);
}

/* Grid */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 16px;
  padding: 20px 24px;
  max-width: 1600px;
  margin: 0 auto;
}

/* Book card */
.card {
  background: var(--surface);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  transition: transform .15s, box-shadow .15s;
  position: relative;
}
.card:hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 20px rgba(0,0,0,.4);
}

.card img {
  width: 100%;
  aspect-ratio: 2/3;
  object-fit: cover;
  display: block;
  background: #222;
}

.card .info {
  padding: 8px 10px;
}

.card .title {
  font-size: 0.82rem;
  font-weight: 600;
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card .author {
  font-size: 0.75rem;
  color: var(--text-dim);
  margin-top: 2px;
  display: -webkit-box;
  -webkit-line-clamp: 1;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card .badge {
  position: absolute;
  top: 6px;
  right: 6px;
  font-size: 0.65rem;
  padding: 2px 6px;
  border-radius: 3px;
  color: white;
  font-weight: 600;
}
.badge.downloaded { background: var(--success); }
.badge.not-downloaded { background: #555; }

/* Detail panel */
.detail-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  z-index: 200;
  justify-content: center;
  align-items: center;
}
.detail-overlay.active { display: flex; }

.detail-panel {
  background: var(--surface);
  border-radius: 12px;
  max-width: 700px;
  width: 90%;
  max-height: 85vh;
  overflow-y: auto;
  box-shadow: 0 10px 40px rgba(0,0,0,.5);
  padding: 24px;
}

.detail-panel .close-btn {
  float: right;
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 1.5rem;
  cursor: pointer;
  line-height: 1;
}
.detail-panel .close-btn:hover { color: var(--text); }

.detail-panel h2 { font-size: 1.3rem; margin-bottom: 4px; }
.detail-panel .meta { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 12px; }
.detail-panel .description { font-size: 0.9rem; line-height: 1.6; margin-bottom: 16px; }
.detail-panel .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.detail-panel .tag {
  background: var(--surface2);
  padding: 3px 10px;
  border-radius: 4px;
  font-size: 0.78rem;
}

.detail-panel .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.detail-panel .actions button {
  padding: 8px 20px;
  border: none;
  border-radius: var(--radius);
  font-size: 0.9rem;
  cursor: pointer;
  transition: background .15s;
}
.btn-primary { background: var(--accent); color: white; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary { background: var(--surface2); color: var(--text); }
.btn-secondary:hover { background: #1a4a8a; }

/* Load more */
.load-more {
  text-align: center;
  padding: 20px;
}
.load-more button {
  padding: 10px 40px;
  border: 1px solid #444;
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--text);
  font-size: 0.9rem;
  cursor: pointer;
}
.load-more button:hover { border-color: var(--accent); }

/* Empty state */
.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-dim);
  font-size: 1.1rem;
}

/* Scrollbar */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #666; }
</style>
</head>
<body>

<header>
  <h1>Standard Ebooks</h1>
  <input type="text" id="search" placeholder="Search by title or author...">
  <span class="stats" id="stats"></span>
</header>

<div class="toolbar">
  <button onclick="doSync()">Sync Catalog</button>
  <button onclick="doEnrich()">Enrich Metadata</button>
  <button onclick="doCovers()">Fetch Covers</button>
  <button onclick="doDownload()">Download All Epubs</button>
  <button class="cancel" onclick="doCancel()" id="cancel-btn" style="display:none">Cancel</button>
</div>

<div id="progress-bar"><div class="fill" id="progress-fill"></div></div>
<div id="progress-msg"></div>

<div class="grid" id="grid"></div>
<div class="load-more" id="load-more" style="display:none">
  <button onclick="loadMore()" id="load-more-btn">Load More</button>
</div>

<div class="detail-overlay" id="detail-overlay">
  <div class="detail-panel" id="detail-panel"></div>
</div>

<script>
const { invoke } = window.__TAURI__.core;
const { listen } = window.__TAURI__.event;
const { convertFileSrc } = window.__TAURI__.core;

const grid = document.getElementById('grid');
const searchInput = document.getElementById('search');
const statsEl = document.getElementById('stats');
const progressFill = document.getElementById('progress-fill');
const progressMsg = document.getElementById('progress-msg');
const cancelBtn = document.getElementById('cancel-btn');
const loadMoreDiv = document.getElementById('load-more');
const loadMoreBtn = document.getElementById('load-more-btn');
const overlay = document.getElementById('detail-overlay');

let allBooks = [];
let currentPage = 1;
let totalPages = 1;
let searchQuery = '';
let searchTimer = null;
let operationRunning = false;
let cacheBust = '';

// --- Init ---
fetchStats();
loadBooks(1);

searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    searchQuery = searchInput.value.trim();
    grid.innerHTML = '';
    currentPage = 1;
    allBooks = [];
    if (searchQuery) {
      doSearch(searchQuery);
    } else {
      loadBooks(1);
    }
  }, 300);
});

overlay.addEventListener('click', (e) => {
  if (e.target === overlay) closeDetail();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeDetail();
});

// --- Data Fetching via invoke() ---

function fetchStats() {
  invoke('get_stats').then(data => {
    statsEl.textContent = `${data.downloaded}/${data.total} downloaded`;
  });
}

function loadBooks(page) {
  invoke('get_books', { page: page, perPage: 60 })
    .then(data => {
      totalPages = data.pages;
      currentPage = data.page;
      renderBooks(data.books, page > 1);
      updateLoadMore(data.total);
    });
}

function doSearch(q) {
  invoke('search_books', { query: q })
    .then(data => {
      allBooks = [];
      totalPages = 1;
      currentPage = 1;
      renderBooks(data.books, false);
      loadMoreDiv.style.display = 'none';
    });
}

function loadMore() {
  if (searchQuery) return;
  loadBooks(currentPage + 1);
}

function updateLoadMore(total) {
  const shown = grid.children.length;
  if (shown < total) {
    loadMoreDiv.style.display = 'block';
    loadMoreBtn.textContent = `Load More (${total - shown} remaining)`;
  } else {
    loadMoreDiv.style.display = 'none';
  }
}

// --- Rendering ---

function renderBooks(books, append) {
  if (!append) {
    grid.innerHTML = '';
    allBooks = [];
  }

  if (!append && books.length === 0) {
    grid.innerHTML = '<div class="empty">No books found.</div>';
    return;
  }

  allBooks = allBooks.concat(books);

  books.forEach(book => {
    const card = document.createElement('div');
    card.className = 'card';
    card.onclick = () => showDetail(book);

    const rn = book.repo_name || '';

    const badgeClass = book.downloaded ? 'downloaded' : 'not-downloaded';
    const badgeText = book.downloaded ? 'Downloaded' : 'Not Downloaded';

    card.innerHTML = `
      <img src="" alt="" loading="lazy"
           onerror="this.onerror=null;this.style.background='#2a2a3e';this.removeAttribute('src');">
      <span class="badge ${badgeClass}">${badgeText}</span>
      <div class="info">
        <div class="title">${esc(book.title)}</div>
        <div class="author">${esc(book.author)}</div>
      </div>
    `;
    grid.appendChild(card);

    // Load cover via asset protocol
    if (rn) {
      invoke('get_cover_path', { repoName: rn }).then(filePath => {
        const assetUrl = convertFileSrc(filePath) + (cacheBust ? '?t=' + cacheBust : '');
        const img = card.querySelector('img');
        if (img) img.src = assetUrl;
      });
    }
  });
}

function showDetail(book) {
  const panel = document.getElementById('detail-panel');
  const rn = book.repo_name || '';

  let desc = book.long_description || book.description || '';
  desc = desc.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();

  let meta = [];
  if (book.author) meta.push(book.author);
  if (book.language) meta.push(`Language: ${book.language}`);
  if (book.word_count) meta.push(`${book.word_count.toLocaleString()} words`);
  if (book.reading_time) meta.push(book.reading_time);
  if (book.reading_ease) meta.push(`Reading ease: ${book.reading_ease.toFixed(1)}`);
  if (book.se_published) meta.push(`Published: ${book.se_published}`);

  let tags = [];
  if (book.categories) tags = tags.concat(book.categories);
  if (book.subjects) tags = tags.concat(book.subjects);

  let collections = '';
  if (book.collections && book.collections.length) {
    collections = `<div style="margin-bottom:12px;font-size:0.85rem;color:var(--text-dim)">
      Collections: ${book.collections.map(c => esc(c)).join(', ')}
    </div>`;
  }

  let sources = '';
  if (book.sources && book.sources.length) {
    sources = `<div style="margin-bottom:12px;font-size:0.85rem">
      <strong>Sources:</strong>
      ${book.sources.map(s => {
        if (s.startsWith('http')) return `<a href="${esc(s)}" target="_blank" style="color:var(--accent)">${esc(s)}</a>`;
        return esc(s);
      }).join('<br>')}
    </div>`;
  }

  panel.innerHTML = `
    <button class="close-btn" onclick="closeDetail()">&times;</button>
    <h2>${esc(book.title)}</h2>
    <div class="meta">${meta.join(' &middot; ')}</div>
    ${desc ? `<div class="description">${esc(desc)}</div>` : ''}
    ${tags.length ? `<div class="tags">${tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
    ${collections}
    ${sources}
    ${book.wikipedia ? `<div style="margin-bottom:12px"><a href="${esc(book.wikipedia)}" target="_blank" style="color:var(--accent);font-size:0.85rem">Wikipedia article</a></div>` : ''}
    <div class="actions">
      ${book.downloaded
        ? `<button class="btn-primary" onclick="openEpub('${esc(rn)}')">Open Epub</button>`
        : `<button class="btn-primary" onclick="downloadSingle('${esc(rn)}')">Build &amp; Download</button>`
      }
      ${book.url ? `<button class="btn-secondary" onclick="window.open('${esc(book.url)}','_blank')">Standard Ebooks Page</button>` : ''}
      ${book.repo ? `<button class="btn-secondary" onclick="window.open('${esc(book.repo)}','_blank')">GitHub Repo</button>` : ''}
    </div>
  `;

  overlay.classList.add('active');
}

function closeDetail() {
  overlay.classList.remove('active');
}

function openEpub(repo) {
  if (!repo) return;
  invoke('open_epub', { repo: repo }).catch(err => {
    progressMsg.textContent = `Error opening epub: ${err}`;
  });
}

function downloadSingle(repo) {
  if (!repo) return;
  progressMsg.textContent = `Building epub for ${repo}...`;

  invoke('download_single', { repo: repo })
    .then(data => {
      if (data.error) {
        progressMsg.textContent = `Error: ${data.error}`;
      } else {
        progressMsg.textContent = `Built ${repo}.epub`;
        fetchStats();
        closeDetail();
        grid.innerHTML = '';
        currentPage = 1;
        allBooks = [];
        loadBooks(1);
      }
    })
    .catch(err => {
      progressMsg.textContent = `Error: ${err}`;
    });
}

// --- Operations with Tauri events ---

function runOperation(commandName) {
  if (operationRunning) return;
  operationRunning = true;

  document.querySelectorAll('.toolbar button:not(.cancel)').forEach(b => b.disabled = true);
  cancelBtn.style.display = '';
  progressFill.style.width = '0%';
  progressMsg.textContent = 'Starting...';

  invoke(commandName).then(() => {
    // Command completed
  }).catch(err => {
    progressMsg.textContent = `Error: ${err}`;
  }).finally(() => {
    finishOperation();
  });
}

// Listen for progress events from Rust backend
listen('op-progress', (event) => {
  const data = event.payload;
  if (data.current && data.total) {
    const pct = (data.current / data.total * 100).toFixed(1);
    progressFill.style.width = pct + '%';
    progressMsg.textContent = `[${data.current}/${data.total}] ${data.title || ''} — ${data.status || ''}`;
  } else if (data.message) {
    progressMsg.textContent = data.message;
  }
});

listen('op-done', (event) => {
  const data = event.payload;
  const parts = Object.entries(data).map(([k, v]) => `${k}: ${v}`);
  progressMsg.textContent = 'Done — ' + parts.join(', ');
  progressFill.style.width = '100%';
});

listen('op-error', (event) => {
  const data = event.payload;
  progressMsg.textContent = `Error: ${data.error}`;
});

function finishOperation() {
  operationRunning = false;
  document.querySelectorAll('.toolbar button:not(.cancel)').forEach(b => b.disabled = false);
  cancelBtn.style.display = 'none';
  cacheBust = Date.now();
  fetchStats();
  grid.innerHTML = '';
  currentPage = 1;
  allBooks = [];
  loadBooks(1);
}

function doSync() { runOperation('sync_catalog'); }
function doEnrich() { runOperation('enrich_all'); }
function doCovers() { runOperation('fetch_covers'); }
function doDownload() { runOperation('download_all'); }
function doCancel() {
  invoke('cancel_operation').then(data => {
    progressMsg.textContent = 'Cancelling...';
  });
}

// --- Util ---

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
</script>
</body>
</html>
